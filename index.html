<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F6F1E5">
  <meta name="description" content="三火工作台 - 你的个人 PWA 工作台,商单管理本地存储,免登录离线可用">
  <title>三火工作台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ======= 左侧菜单 ======= -->
    <aside class="sidebar">
      <div class="logo">三火</div>
      <nav class="nav">
        <button class="nav-item active" data-view="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M3.5 10.8 12 4l8.5 6.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 20v-5h4v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>首页</span>
        </button>
        <button class="nav-item" data-view="todo">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="badge" id="badge-todo">0</span>
          </span>
          <span>待办</span>
        </button>
        <button class="nav-item" data-view="balance">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="14" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M3 10.5h18" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="14.5" r="1.6" fill="currentColor"/></svg>
            <span class="badge" id="badge-balance">0</span>
          </span>
          <span>结余</span>
        </button>
        <button class="nav-item" data-view="mine">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c.8-3.5 3.5-5.5 7-5.5s6.2 2 7 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span>我的</span>
        </button>
      </nav>
      <div class="local-tip">
        <span>本地存储</span>
        <span>离线可用</span>
      </div>
    </aside>

    <!-- ======= 右侧内容 ======= -->
    <main class="content">

      <!-- 首页:欢迎语 + 状态统计 -->
      <section class="view active" id="view-home">
        <div class="banner">
          <img src="assets/images/2_243_cropped.png" alt="" class="banner-img">
          <span class="banner-tag">今日元气补给站</span>
        </div>
        <div class="greet">
          <h1 id="greet-title">三火,早上好呀!</h1>
          <p class="greet-sub"><span id="greet-msg">愿你今天也元气满满</span><svg class="flower" viewBox="0 0 24 24" fill="none"><g fill="#FFC9CE"><circle cx="12" cy="6.5" r="3"/><circle cx="16.8" cy="9.8" r="3"/><circle cx="15" cy="15.5" r="3"/><circle cx="9" cy="15.5" r="3"/><circle cx="7.2" cy="9.8" r="3"/></g><circle cx="12" cy="11.5" r="2.8" fill="#FFE066"/></svg></p>
          <div class="date-row"><span id="today-date">8月4日 · 周二</span><svg class="flower-sm" viewBox="0 0 24 24" fill="none"><g fill="#FFC9CE"><circle cx="12" cy="6.5" r="3"/><circle cx="16.8" cy="9.8" r="3"/><circle cx="15" cy="15.5" r="3"/><circle cx="9" cy="15.5" r="3"/><circle cx="7.2" cy="9.8" r="3"/></g><circle cx="12" cy="11.5" r="2.8" fill="#FFE066"/></svg></div>
        </div>

        <!-- 商单状态总览 -->
        <div class="stat-card status-overview">
          <button class="stat stat-btn" data-goto="todo">
            <b id="ov-todo">0</b><span class="st-label st-todo">待办</span>
          </button>
          <button class="stat stat-btn" data-goto="mine" data-status="pending">
            <b id="ov-pending">0</b><span class="st-label st-pending">待发布</span>
          </button>
          <button class="stat stat-btn" data-goto="balance">
            <b id="ov-collect">0</b><span class="st-label st-collect">待结款</span>
          </button>
          <button class="stat stat-btn" data-goto="mine" data-status="done">
            <b id="ov-done">0</b><span class="st-label st-done">已完成</span>
          </button>
        </div>

        <!-- 待办状态商单预览 -->
        <div class="card todo-preview">
          <div class="card-head">
            <span class="card-title"><svg class="c-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="3.5" stroke="#4A7C5F" stroke-width="2"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4.5" stroke="#4A7C5F" stroke-width="2" stroke-linecap="round"/></svg>待办商单</span>
            <span class="chip chip-pink" id="home-todo-chip">0 单</span>
          </div>
          <div class="task-preview" id="home-todo-list"></div>
          <button class="mini-btn" data-goto="todo">去待办看看 →</button>
        </div>

        <!-- 待结款商单预览 -->
        <div class="card balance-preview">
          <div class="card-head">
            <span class="card-title light"><svg class="c-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="14" rx="3.5" stroke="#fff" stroke-width="2"/><path d="M3 10.5h18" stroke="#fff" stroke-width="2"/><circle cx="16.5" cy="14.5" r="1.6" fill="#fff"/></svg>待结款</span>
            <span class="chip chip-glass" id="home-balance-chip">0 单</span>
          </div>
          <div class="stat-row">
            <div class="stat"><b id="h-balance-amount">¥0</b><span>待收款</span></div>
            <div class="stat"><b id="h-balance-count">0 单</b><span>待结款</span></div>
            <div class="stat"><b id="h-total-income">¥0</b><span>累计收入</span></div>
          </div>
          <button class="mini-btn light" data-goto="balance">去结余看看 →</button>
        </div>

        <div class="leaf-line">
          <svg class="leaf" viewBox="0 0 24 24" fill="none"><path d="M5 19C5 11 11 5 19 5c.5 7.5-5 14-14 14Z" fill="#B9D8B0"/><path d="M5 19C9 13 14 9 18.5 5.5" stroke="#6FA98B" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>数据都在本地,安心离线使用</span>
          <svg class="leaf" viewBox="0 0 24 24" fill="none"><path d="M5 19C5 11 11 5 19 5c.5 7.5-5 14-14 14Z" fill="#B9D8B0"/><path d="M5 19C9 13 14 9 18.5 5.5" stroke="#6FA98B" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
      </section>

      <!-- 待办:状态=待办 的商单 -->
      <section class="view" id="view-todo">
        <div class="page-head">
          <h2>待办商单</h2>
          <span class="chip chip-pink" id="todo-head-chip">0 单</span>
        </div>
        <div class="view-filter-row">
          <span class="vf-hint">状态:待办</span>
          <button class="mini-btn vf-add" data-goto="mine">新增商单 +</button>
        </div>
        <div class="order-list" id="todo-order-list"></div>
      </section>

      <!-- 结余:状态=待结款 的商单 -->
      <section class="view" id="view-balance">
        <div class="page-head">
          <h2>结余待收</h2>
          <span class="chip chip-orange" id="balance-head-chip">0 单</span>
        </div>

        <div class="stat-card">
          <div class="stat"><b id="sb-count">0</b><span>待结款</span></div>
          <div class="stat"><b id="sb-amount">¥0</b><span>待收总额</span></div>
          <div class="stat"><b id="sb-deposit">¥0</b><span>定金已收</span></div>
        </div>

        <div class="reminder" id="reminder-bar" hidden>
          <svg class="bell" viewBox="0 0 24 24" fill="none"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 3.2-1.2 4.4-1.8 5h14.6c-.6-.6-1.8-1.8-1.8-5A5.5 5.5 0 0 0 12 3.5Z" stroke="#8A4A3A" stroke-width="2" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" stroke="#8A4A3A" stroke-width="2" stroke-linecap="round"/></svg>
          <div class="reminder-text">
            <b id="reminder-main">明日 9:00 · 星野咖啡拍摄</b>
            <span id="reminder-sub">还有 0 单待结款</span>
          </div>
        </div>

        <div class="order-list" id="balance-order-list"></div>
      </section>

      <!-- 我的:新增商单 + 全部商单管理 -->
      <section class="view" id="view-mine">
        <div class="page-head">
          <h2>我的商单</h2>
          <span class="chip chip-green" id="mine-total-chip">共 0 单</span>
        </div>

        <div class="mine-filters" id="mine-filters">
          <button class="filter active" data-status="all">全部</button>
          <button class="filter" data-status="todo">待办</button>
          <button class="filter" data-status="pending">待发布</button>
          <button class="filter" data-status="collect">待结款</button>
          <button class="filter" data-status="done">已完成</button>
        </div>

        <div class="order-list" id="mine-order-list"></div>
        <button class="fab" id="order-add-btn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </section>

    </main>
  </div>

  <!-- 新增/编辑商单弹窗 -->
  <div class="modal-mask" id="order-modal" hidden>
    <div class="modal order-form-modal">
      <h3 id="order-form-title">新增商单</h3>
      <label>项目名称<input type="text" id="f-name" placeholder="如:星野咖啡 · 秋季上新" maxlength="30"></label>
      <label>时间<input type="datetime-local" id="f-date"></label>
      <div class="form-row2">
        <label>费用(元)<input type="number" id="f-fee" min="0" placeholder="如 3600"></label>
        <label>定金(元)<input type="number" id="f-deposit" min="0" placeholder="如 1000"></label>
      </div>
      <label>要求项列表<textarea id="f-requirements" rows="3" placeholder="每行一项,如:&#10;产品 x12 图&#10;30s 视频"></textarea></label>
      <label>状态
        <div class="status-picker" id="f-status-picker">
          <button type="button" class="sp-item sp-todo" data-status="todo">待办</button>
          <button type="button" class="sp-item sp-pending" data-status="pending">待发布</button>
          <button type="button" class="sp-item sp-collect" data-status="collect">待结款</button>
          <button type="button" class="sp-item sp-done" data-status="done">已完成</button>
        </div>
      </label>
      <div class="modal-actions">
        <button class="btn-plain" id="order-modal-cancel">取消</button>
        <button class="btn-primary" id="order-modal-save">保存商单</button>
      </div>
    </div>
  </div>

  <!-- 商单详情弹窗(可编辑) -->
  <div class="modal-mask" id="detail-modal" hidden>
    <div class="modal detail-modal">
      <div class="detail-head">
        <h3>商单详情</h3>
        <span class="status" id="d-status"></span>
      </div>
      <label>项目名称<input type="text" id="e-name" maxlength="30"></label>
      <label>时间<input type="datetime-local" id="e-date"></label>
      <div class="form-row2">
        <label>费用(元)<input type="number" id="e-fee" min="0"></label>
        <label>定金(元)<input type="number" id="e-deposit" min="0"></label>
      </div>
      <label>要求项列表<textarea id="e-req" rows="3" placeholder="每行一项"></textarea></label>
      <label>状态
        <div class="status-picker" id="e-status-picker">
          <button type="button" class="sp-item sp-todo" data-status="todo">待办</button>
          <button type="button" class="sp-item sp-pending" data-status="pending">待发布</button>
          <button type="button" class="sp-item sp-collect" data-status="collect">待结款</button>
          <button type="button" class="sp-item sp-done" data-status="done">已完成</button>
        </div>
      </label>
      <div class="detail-row meta-row">
        <span class="d-label">创建时间</span>
        <span class="d-value" id="d-created">—</span>
      </div>
      <button class="detail-del-link" id="detail-del">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M7 7l1 12a1.5 1.5 0 0 0 1.5 1.4h5A1.5 1.5 0 0 0 16 19l1-12M10 11v5.5M14 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        删除该商单
      </button>
      <div class="modal-actions">
        <button class="btn-plain" id="detail-close">取消</button>
        <button class="btn-primary" id="detail-save">保存修改</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗(标准提示样式) -->
  <div class="modal-mask" id="confirm-modal" hidden>
    <div class="modal confirm-modal">
      <div class="cf-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M7 7l1 12a1.5 1.5 0 0 0 1.5 1.4h5A1.5 1.5 0 0 0 16 19l1-12M10 11v5.5M14 11v5.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3 class="cf-title" id="cf-title">确认删除</h3>
      <p class="cf-text" id="cf-text">确定要删除吗?</p>
      <div class="cf-actions">
        <button class="btn-plain" id="cf-cancel">取消</button>
        <button class="btn-danger" id="cf-ok">确认删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
